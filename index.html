<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>Tic Tac Toe</h1>
        
        <!-- Skor Tablosu -->
        <div class="scoreboard">
            <div class="score-card playerX">
                <span>Oyuncu X</span>
                <span id="scoreX">0</span>
            </div>
            <div class="score-card ties">
                <span>Beraberlik</span>
                <span id="scoreTie">0</span>
            </div>
            <div class="score-card playerO">
                <span>Oyuncu O</span>
                <span id="scoreO">0</span>
            </div>
        </div>

        <!-- Sıra Göstergesi -->
        <div class="status-message" id="statusMessage">Sıra Oyuncu X'te</div>

        <!-- Oyun Tahtası -->
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <!-- Kontrol Butonları -->
        <div class="controls">
            <button id="restartBtn">Oyunu Sıfırla</button>
            <button id="resetScoreBtn">Skorları Sıfırla</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
